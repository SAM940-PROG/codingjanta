<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" role="img" aria-label="Binary Search — eliminate half the candidates each step">
  <rect width="1200" height="630" fill="#171722"/>
  <text x="60" y="120" font-family="sans-serif" font-size="54" font-weight="800" fill="#ffffff">Binary Search</text>
  <text x="60" y="175" font-family="sans-serif" font-size="26" fill="#a3a3b8">Eliminate half the candidates each step — O(log n)</text>
  <g font-family="monospace" font-size="30" font-weight="700">
    <rect x="60" y="240" width="120" height="80" rx="12" fill="#1e1e2c" stroke="#2c2c40"/>
    <text x="120" y="292" text-anchor="middle" fill="#e7e7f0">1</text>
    <rect x="195" y="240" width="120" height="80" rx="12" fill="#1e1e2c" stroke="#2c2c40"/>
    <text x="255" y="292" text-anchor="middle" fill="#e7e7f0">3</text>
    <rect x="330" y="240" width="120" height="80" rx="12" fill="#1e1e2c" stroke="#8f81ff" stroke-width="4"/>
    <text x="390" y="292" text-anchor="middle" fill="#ffffff">7</text>
    <rect x="465" y="240" width="120" height="80" rx="12" fill="#1e1e2c" stroke="#2c2c40"/>
    <text x="525" y="292" text-anchor="middle" fill="#e7e7f0">9</text>
  </g>
  <text x="60" y="380" font-family="sans-serif" font-size="24" fill="#8f81ff">mid → discard the half that cannot contain the answer</text>
  <text x="60" y="560" font-family="sans-serif" font-size="20" fill="#a3a3b8">Ultimate DSA Guide — Competitive Programming track</text>
</svg>
